<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigedin Académico - UniPutumayo</title>
    <!-- Estilos CSS oficiales extraídos del portal real -->
    <style>
        .campo {
            flex-direction: column;
            gap: 6px;
            display: flex;
            margin-bottom: 16px;
        }

        .campo-etiqueta {
            color: #1f2937;
            font-size: .85rem;
            font-weight: 600;
        }

        .login {
            background: linear-gradient(135deg, #18668fd9, #4d7a0fcc), url('img/fondo.jpg') center / cover no-repeat fixed;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tarjeta {
            color: #1f2937;
            background: #fffffffa;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            box-shadow: 0 15px 35px #00000040;
        }

        .encabezado {
            color: #fff;
            letter-spacing: .5px;
            text-transform: uppercase;
            background: #18668f;
            padding: 10px 15px;
            font-size: .95rem;
            font-weight: 600;
            text-align: center;
        }

        .logo {
            max-width: 100%;
            max-height: 75px;
        }

        .olvide {
            color: #18668f;
            font-size: .9rem;
            font-weight: 600;
            text-decoration: none;
        }

        .olvide:hover {
            text-decoration: underline;
        }

        .separador {
            color: #595957;
            align-items: center;
            gap: 10px;
            font-size: .85rem;
            display: flex;
            margin: 20px 0;
        }

        .separador:before, .separador:after {
            content: "";
            background: #d5dbe5;
            flex: 1;
            height: 1px;
        }

        .google {
            justify-content: center;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .boton {
            border-radius: 8px;
            height: 44px;
            font-weight: 600;
            background: #18668f;
            color: white;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
        }

        .boton:hover {
            background: #124f70;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-body {
            padding: 24px;
        }

        .text-center {
            text-align: center;
        }

        .mb-4 {
            margin-bottom: 16px;
        }

        .input-wrapper {
            display: flex; 
            align-items: center; 
            border: 1px solid #d5dbe5; 
            border-radius: 8px; 
            background: #fff; 
            padding: 0 10px;
        }

        .input-wrapper:focus-within {
            border-color: #18668f;
            box-shadow: 0 0 0 2px rgba(24, 102, 143, 0.15);
        }

        .input-wrapper input {
            border: none; 
            outline: none; 
            width: 100%; 
            padding: 10px; 
            background: transparent;
            font-size: 0.95rem;
        }

        .google-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #dadce0;
            padding: 0 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #3c4043;
            font-size: 0.9rem;
            font-weight: 500;
            background: #fff;
            width: 100%;
            justify-content: center;
            box-sizing: border-box;
            height: 40px;
        }

        .google-btn:hover {
            background-color: #f8f9fa;
        }

        .footer-note {
            font-size: 0.8rem;
            color: #595957;
            text-align: center;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="login">
        <div class="tarjeta">
            <div class="encabezado">
                Sigedin Académico
            </div>

            <div class="card-body">
                <div class="text-center mb-4">
                    <img src="img/logo.png" alt="UniPutumayo" class="logo">
                </div>

                <h2 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; text-align: center;">Iniciar sesión</h2>

                <!-- Formulario conectado al servidor de Python -->
                <form action="/" method="POST">
                    <div class="campo">
                        <label class="campo-etiqueta" for="usuario">Documento o usuario</label>
                        <div class="input-wrapper">
                            <!-- Icono de tarjeta SVG -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line><line x1="6" y1="15" x2="10" y2="15"></line></svg>
                            <input type="text" id="usuario" name="usuario" placeholder="Ej. 1122334455" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label class="campo-etiqueta" for="clave">Contraseña</label>
                        <div class="input-wrapper">
                            <!-- Icono de candado SVG -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="clave" name="clave" placeholder="••••••••" required>
                            
                            <!-- Botón / Ícono del ojo para ver la contraseña -->
                            <span id="togglePassword" style="cursor: pointer; display: flex; align-items: center; padding: 0 5px;">
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div style="text-align: right; margin-bottom: 20px;">
                        <a href="#" class="olvide">¿Olvidé mi contraseña?</a>
                    </div>

                    <button type="submit" class="boton">Ingresar &rarr;</button>
                </form>

                <div class="separador">o</div>

                <div class="google">
                    <a href="#" class="google-btn">
                        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                        Continuar con Google
                    </a>
                </div>

                <div class="footer-note">
                    Con tu cuenta institucional @itp.edu.co (debes vincularla antes en «Mis datos»).
                </div>
            </div>
        </div>
    </div>

    <!-- Script para alternar la visibilidad de la contraseña -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#clave');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            if (type === 'text') {
                eyeIcon.style.stroke = '#2563eb'; // Color azul cuando está visible
            } else {
                eyeIcon.style.stroke = '#6b7280'; // Color gris por defecto
            }
        });
    </script>
</body>
</html>
